[project]
name = "bitchat-cli"
version = "0.1.0"
description = "A pragmatic BitChat CLI for public BLE chat"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "bleak>=0.22.3",
  "cryptography>=45.0.0",
]

[project.scripts]
bitchat = "bitchat_cli.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bitchat_cli"]
