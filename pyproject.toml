[project]
name = "bitchat4agents"
version = "0.1.0"
description = "A pragmatic BitChat CLI for public BLE chat"
readme = "README.md"
license = "Unlicense"
requires-python = ">=3.11"
dependencies = [
  "bleak>=0.22.3",
  "coincurve>=21.0.0",
  "cryptography>=45.0.0",
  "httpx[socks]>=0.28.1",
  "python-socks[asyncio]>=2.7.1",
  "websockets>=15.0.1",
]

[project.scripts]
bitchat = "bitchat_cli.cli:main"
bchat = "bitchat_cli.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bitchat_cli"]
