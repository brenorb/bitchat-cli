name: Verify

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.13"
      - run: uv sync --no-config --locked --dev
      - run: uv run --no-config --locked ruff check .
      - run: uv run --no-config --locked pytest
      - run: uv build --no-config
